name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
      - name: Syntax check
        run: |
          python -m compileall -q . -x 'node_modules|.git' 2>&1 | tail -5 || true
      - name: Import check
        run: |
          python -c "import sys; [print(f'OK {m}') for m in sys.modules if m.startswith('src')]" || true
